name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  direct-path:
    name: Node ${{ matrix.node }} direct path
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify the direct path
        run: npm run check
